name: Docker Build & Push

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    # Checkout repository
    - name: Checkout repository
      uses: actions/checkout@v3

    # Set up Docker Buildx (optional but recommended for efficient builds)
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    # Log in to GitLab Container Registry
    - name: Log in to GitLab Container Registry
      run: echo $CI_REGISTRY_PASSWORD | docker login -u $CI_REGISTRY_USER --password-stdin $CI_REGISTRY

    # Build Docker image
    - name: Build Docker image
      run: docker build -t $CI_REGISTRY_IMAGE:latest .

    # Push Docker image to GitLab Container Registry
    - name: Push Docker image
      run: docker push $CI_REGISTRY_IMAGE:latest
